query.getAll=select u.id, u.apellidos, u.nombres, u.correo, u.rol_id, r.nombre as rol_nombre, u.contrasena, r.permisos from usuario u join rol r on u.rol_id=r.id
query.findById=select u.id, u.apellidos, u.nombres, u.correo, u.rol_id, r.nombre as rol_nombre, u.contrasena, r.permisos from usuario u join rol r on u.rol_id=r.id where u.id=?
query.findByEmail=select u.id, u.apellidos, u.nombres, u.correo, u.rol_id, r.nombre as rol_nombre, u.contrasena, r.permisos  from usuario u join rol r on u.rol_id=r.id where u.correo = ?
query.validate=select u.id, u.apellidos, u.nombres, u.correo, u.rol_id, r.nombre as rol_nombre, u.contrasena, r.permisos from usuario u join rol r on u.rol_id=r.id where u.correo = ? and u.contrasena = ?
query.create=insert into public.usuario(nombres, apellidos, correo, rol_id, contrasena) values(?, ?, ?, ?, ?)
query.delete=delete from public.usuario u where u.id = ?
query.update=UPDATE public.usuario SET apellidos=?, nombres=?, correo=?, rol_id=? WHERE id=?;
query.changePassword=update usuario set contrasena=?, password_token=null where correo=?;
query.findByPasswordToken=select u.id, u.apellidos, u.nombres, u.correo, u.rol_id, u.password_token, r.nombre as rol_nombre, u.contrasena, r.permisos from usuario u join rol r on u.rol_id=r.id where u.password_token=?
query.setPasswordToken=update usuario set password_token=? where correo=?;