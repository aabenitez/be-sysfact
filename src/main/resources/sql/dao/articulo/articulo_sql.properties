articulo.getAll=select a.id, a.nombre, a.descripcion, a.precio, a.tasa_iva, a.nombre_imagen, a.unidad_medida_id, um.nombre as um_nombre, um.plural as um_plural, a.proveedor_id, p.nombre as proveedor_nombre, coalesce(s.existencia, 0) as existencia, coalesce(s.stock_minimo, 0) as stock_minimo from articulo a join unidad_medida um on a.unidad_medida_id = um.id join proveedor p on a.proveedor_id = p.id left join stock s on s.articulo_id = a.id order by a.nombre asc
articulo.findById=select a.id, a.nombre, a.descripcion, a.precio, a.tasa_iva, a.nombre_imagen, a.unidad_medida_id, um.nombre as um_nombre, um.plural as um_plural, a.proveedor_id, p.nombre as proveedor_nombre, coalesce(s.existencia, 0) as existencia, coalesce(s.stock_minimo, 0) as stock_minimo from articulo a join unidad_medida um on a.unidad_medida_id = um.id join proveedor p on a.proveedor_id = p.id left join stock s on s.articulo_id = a.id where a.id = ?
articulo.insert=insert into public.articulo (nombre, descripcion, precio, unidad_medida_id, proveedor_id, nombre_imagen, tasa_iva) values (?, ?, ?, ?, ?, ?, ?)
articulo.update=update public.articulo set nombre = ?, descripcion = ?, precio = ?, unidad_medida_id = ?, proveedor_id = ?, nombre_imagen = ?, tasa_iva = ? where id = ?
articulo.delete=delete from public.articulo where id = ?
articulo.insertStock=insert into public.stock (articulo_id, existencia) values (?, 0) on conflict (articulo_id) do nothing
articulo.deleteStock=delete from public.stock where articulo_id = ?
articulo.countVentas=select count(distinct venta_id) from public.detalle_venta where articulo_id = ?
