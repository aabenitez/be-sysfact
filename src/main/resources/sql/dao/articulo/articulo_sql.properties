articulo.getAll=select a.id, a.nombre, a.descripcion, a.precio, a.nombre_imagen, a.unidad_medida_id, um.nombre as um_nombre, um.plural as um_plural, a.proveedor_id, p.nombre as proveedor_nombre from articulo a join unidad_medida um on a.unidad_medida_id = um.id join proveedor p on a.proveedor_id = p.id order by a.nombre asc
articulo.findById=select a.id, a.nombre, a.descripcion, a.precio, a.nombre_imagen, a.unidad_medida_id, um.nombre as um_nombre, um.plural as um_plural, a.proveedor_id, p.nombre as proveedor_nombre from articulo a join unidad_medida um on a.unidad_medida_id = um.id join proveedor p on a.proveedor_id = p.id where a.id = ?
articulo.insert=insert into public.articulo (nombre, descripcion, precio, unidad_medida_id, proveedor_id, nombre_imagen) values (?, ?, ?, ?, ?, ?)
articulo.update=update public.articulo set nombre = ?, descripcion = ?, precio = ?, unidad_medida_id = ?, proveedor_id = ?, nombre_imagen = ? where id = ?
articulo.delete=delete from public.articulo where id = ?