venta.getAll=select v.id, v.condicion_venta, v.fecha, v.total_iva5, v.total_iva10, v.total_exenta, v.total_descuento, v.total_factura, v.usuario_id, u.nombres as usuario_nombres, u.apellidos as usuario_apellidos, u.correo as usuario_correo, v.cliente_id, c.ci_ruc as cliente_ci_ruc, c.nombres as cliente_nombres, c.apellidos as cliente_apellidos, c.email as cliente_email, c.telefono as cliente_telefono from venta v inner join usuario u on v.usuario_id = u.id left join cliente c on v.cliente_id = c.id order by v.fecha desc
venta.findById=select v.id, v.condicion_venta, v.fecha, v.total_iva5, v.total_iva10, v.total_exenta, v.total_descuento, v.total_factura, v.usuario_id, u.nombres as usuario_nombres, u.apellidos as usuario_apellidos, u.correo as usuario_correo, v.cliente_id, c.ci_ruc as cliente_ci_ruc, c.nombres as cliente_nombres, c.apellidos as cliente_apellidos, c.email as cliente_email, c.telefono as cliente_telefono from venta v inner join usuario u on v.usuario_id = u.id left join cliente c on v.cliente_id = c.id where v.id = ?
venta.insert=insert into public.venta (condicion_venta, total_iva5, total_iva10, total_exenta, total_descuento, total_factura, cliente_id, usuario_id) values (?, ?, ?, ?, ?, ?, ?, ?)
venta.insertDetalle=insert into public.detalle_venta (cantidad, descuento, exenta, iva10, iva5, precio_venta, venta_id, articulo_id) values (?, ?, ?, ?, ?, ?, ?, ?)
venta.updateStock=update public.stock set existencia = existencia - ? where articulo_id = ?
venta.getDetallesByVentaId=select d.id, d.cantidad, d.descuento, d.exenta, d.iva10, d.iva5, d.precio_venta, d.articulo_id, a.nombre as articulo_nombre from detalle_venta d join articulo a on d.articulo_id = a.id where d.venta_id = ?