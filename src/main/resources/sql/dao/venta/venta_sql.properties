venta.getAll=select v.id, v.condicion_venta, v.forma_pago, v.fecha, v.total_iva5, v.total_iva10, v.total_exenta, v.total_descuento, v.total_factura, v.estado, (select coalesce(sum(co.monto), 0) from cobro co where co.venta_id = v.id and co.estado = 'VIGENTE') as cobrado, v.anulacion_fecha, v.anulacion_motivo, v.anulacion_usuario_id, ua.nombres as anulacion_usuario_nombres, ua.apellidos as anulacion_usuario_apellidos, ua.correo as anulacion_usuario_correo, ra.id as anulacion_rol_id, ra.nombre as anulacion_rol_nombre, ra.permisos as anulacion_rol_permisos, v.usuario_id, u.nombres as usuario_nombres, u.apellidos as usuario_apellidos, u.correo as usuario_correo, r.id as usuario_rol_id, r.nombre as usuario_rol_nombre, r.permisos as usuario_rol_permisos, v.cliente_id, c.ci_ruc as cliente_ci_ruc, c.nombres as cliente_nombres, c.apellidos as cliente_apellidos, c.email as cliente_email, c.telefono as cliente_telefono from venta v inner join usuario u on v.usuario_id = u.id left join rol r on u.rol_id = r.id left join cliente c on v.cliente_id = c.id left join usuario ua on v.anulacion_usuario_id = ua.id left join rol ra on ua.rol_id = ra.id order by v.fecha desc
venta.findById=select v.id, v.condicion_venta, v.forma_pago, v.fecha, v.total_iva5, v.total_iva10, v.total_exenta, v.total_descuento, v.total_factura, v.estado, (select coalesce(sum(co.monto), 0) from cobro co where co.venta_id = v.id and co.estado = 'VIGENTE') as cobrado, v.anulacion_fecha, v.anulacion_motivo, v.anulacion_usuario_id, ua.nombres as anulacion_usuario_nombres, ua.apellidos as anulacion_usuario_apellidos, ua.correo as anulacion_usuario_correo, ra.id as anulacion_rol_id, ra.nombre as anulacion_rol_nombre, ra.permisos as anulacion_rol_permisos, v.usuario_id, u.nombres as usuario_nombres, u.apellidos as usuario_apellidos, u.correo as usuario_correo, r.id as usuario_rol_id, r.nombre as usuario_rol_nombre, r.permisos as usuario_rol_permisos, v.cliente_id, c.ci_ruc as cliente_ci_ruc, c.nombres as cliente_nombres, c.apellidos as cliente_apellidos, c.email as cliente_email, c.telefono as cliente_telefono from venta v inner join usuario u on v.usuario_id = u.id left join rol r on u.rol_id = r.id left join cliente c on v.cliente_id = c.id left join usuario ua on v.anulacion_usuario_id = ua.id left join rol ra on ua.rol_id = ra.id where v.id = ?
venta.insert=insert into public.venta (condicion_venta, total_iva5, total_iva10, total_exenta, total_descuento, total_factura, cliente_id, usuario_id, forma_pago) values (?, ?, ?, ?, ?, ?, ?, ?, ?)
venta.insertDetalle=insert into public.detalle_venta (cantidad, descuento, exenta, iva10, iva5, precio_venta, venta_id, articulo_id) values (?, ?, ?, ?, ?, ?, ?, ?)
venta.updateStock=update public.stock set existencia = existencia - ? where articulo_id = ?
venta.getDetallesByVentaId=select d.id, d.cantidad, d.descuento, d.exenta, d.iva10, d.iva5, d.precio_venta, d.articulo_id, a.nombre as articulo_nombre, a.descripcion as articulo_descripcion, a.precio as articulo_precio, a.tasa_iva as articulo_tasa_iva, a.nombre_imagen as articulo_nombre_imagen, a.unidad_medida_id, um.nombre as um_nombre, um.plural as um_plural, a.proveedor_id, p.nombre as proveedor_nombre, p.contacto as proveedor_contacto, p.telefono as proveedor_telefono, p.direccion as proveedor_direccion from detalle_venta d join articulo a on d.articulo_id = a.id join unidad_medida um on a.unidad_medida_id = um.id join proveedor p on a.proveedor_id = p.id where d.venta_id = ? order by d.id
venta.update=update public.venta set condicion_venta = ?, total_iva5 = ?, total_iva10 = ?, total_exenta = ?, total_descuento = ?, total_factura = ?, cliente_id = ?, forma_pago = ? where id = ? and estado = 'EMITIDA'
venta.deleteDetalles=delete from public.detalle_venta where venta_id = ?
venta.devolverStock=update public.stock set existencia = existencia + ? where articulo_id = ?
venta.anular=update public.venta set estado = 'ANULADA', anulacion_fecha = current_timestamp, anulacion_usuario_id = ?, anulacion_motivo = ? where id = ? and estado = 'EMITIDA'
