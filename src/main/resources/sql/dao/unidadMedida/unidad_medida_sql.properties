unidadMedida.getAll=select * from unidad_medida where true
unidadMedida.findById=select * from unidad_medida where id=? limit 1
unidadMedida.insert=insert into unidad_medida (nombre, plural) values (?,?)
unidadMedida.update=update unidad_medida set nombre=?, plural=? where id=?
unidadMedida.delete=delete from unidad_medida where id=?